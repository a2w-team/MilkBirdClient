[package]
name = "milkbird-tray"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[build-dependencies]
tauri-build = "2.7.3"

[dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.4", features = ["tray-icon", "image-png"] }
