[package]
name = "milkbird-pet"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Performance-first native desktop pet companion for MilkBird Club"

[lib]
name = "milkbird_pet"
path = "src/lib.rs"

[[bin]]
name = "milkbird-pet"
path = "src/main.rs"

[[bin]]
name = "milkbird-pet-preview"
path = "src/bin/preview.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFArray",
    "CFBase",
    "CFCGTypes",
    "CFData",
    "CFDictionary",
    "CFNumber",
    "CFString",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGColorSpace",
    "CGDataProvider",
    "CGGeometry",
    "CGImage",
    "CGWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSDate",
    "NSDictionary",
    "NSDistributedNotificationCenter",
    "NSGeometry",
    "NSNotification",
    "NSObjCRuntime",
    "NSRunLoop",
    "NSString",
    "NSTimer",
    "NSValue",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std",
    "CALayer",
    "CATransaction",
    "objc2-core-foundation",
    "objc2-core-graphics",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "NSApplication",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSGraphics",
    "NSMenu",
    "NSMenuItem",
    "NSPanel",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSText",
    "NSTextField",
    "NSTrackingArea",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
    "objc2-core-foundation",
    "objc2-quartz-core",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
